<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1a73e8"/>
  
  <!-- Graduation cap -->
  <g transform="translate(256, 180)">
    <!-- Cap top -->
    <polygon points="-80,0 0,-50 80,0 0,30" fill="#ffffff"/>
    <!-- Cap tassel -->
    <line x1="60" y1="-10" x2="90" y2="40" stroke="#ffc107" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="45" r="8" fill="#ffc107"/>
  </g>
  
  <!-- Book -->
  <g transform="translate(256, 300)">
    <rect x="-70" y="-40" width="140" height="90" rx="8" fill="#ffffff"/>
    <rect x="-65" y="-35" width="60" height="80" rx="4" fill="#e3f2fd"/>
    <rect x="5" y="-35" width="60" height="80" rx="4" fill="#e3f2fd"/>
    <line x1="0" y1="-35" x2="0" y2="45" stroke="#1a73e8" stroke-width="2"/>
    <!-- Text lines -->
    <rect x="-55" y="-20" width="40" height="4" rx="2" fill="#90caf9"/>
    <rect x="-55" y="-10" width="35" height="4" rx="2" fill="#90caf9"/>
    <rect x="-55" y="0" width="45" height="4" rx="2" fill="#90caf9"/>
    <rect x="15" y="-20" width="40" height="4" rx="2" fill="#90caf9"/>
    <rect x="15" y="-10" width="35" height="4" rx="2" fill="#90caf9"/>
    <rect x="15" y="0" width="45" height="4" rx="2" fill="#90caf9"/>
  </g>
  
  <!-- Text "CRS" -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">CRS</text>
</svg>