spring:
  application:
    name: crs
  # 默认使用 MySQL,通过环境变量配置连接信息
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none  # 使用 schema.sql + data.sql 显式管理 schema
  properties:
    hibernate:
      format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

# CRS 业务配置
crs:
  security:
    # JWT 密钥——生产环境必须通过环境变量 JWT_SECRET 覆盖(至少 32 字符)
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-ms: 86400000  # 24h
    # 成绩加密密钥——生产环境必须通过环境变量 GRADE_ENCRYPTION_KEY 覆盖(Base64 编码的 AES-256 密钥)
    grade-encryption-key: ${GRADE_ENCRYPTION_KEY:}
  registration:
    # 当前学期
    current-semester: ${CURRENT_SEMESTER:2026-FALL}
    # 注册周期状态: open | add_drop | closed
    current-phase: open
  # 选课业务规则
  rules:
    max-primary: 4
    max-alternate: 2
    offering-max-students: 10
    offering-min-students: 3
  # Billing 通知重试配置
  billing:
    retry-count: 3
    retry-delay-ms: 1000
    # 重试轮询间隔(计费重试定时任务, 由 SchedulingConfig 按 crs.scheduler.enabled 启停)
    check-interval-ms: 30000
    # 模拟失败开关: 开启时 Billing 通知会随机失败,用于测试重试逻辑; 生产环境务必保持 false
    simulate-failure-enabled: ${CRS_BILLING_SIMULATE_FAILURE:false}
  # 定时任务总开关(环境变量 CRS_SCHEDULER_ENABLED)
  # 本地开发默认启用; docker 多实例部署时仅实例 1 设为 true, 其余 false
  scheduler:
    enabled: ${CRS_SCHEDULER_ENABLED:true}

# Actuator 监控端点配置
# 仅暴露必要端点: health, info, metrics
# 禁用敏感端点: env, beans, configprops, shutdown
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false  # 禁止通过 /info 暴露环境变量

logging:
  level:
    com.crs: INFO
    org.hibernate.SQL: DEBUG
