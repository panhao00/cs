# ============================================
# Nginx 负载均衡配置 — CRS 课程注册系统
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 日志格式(JSON)
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_status":"$upstream_status"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Spring Boot 应用上游集群
    upstream crs_backend {
        # 负载均衡策略: 轮询 (round-robin)
        # Spring Boot 无状态 JWT 认证, 可安全使用轮询
        server crs-app1:8080;
        server crs-app2:8080;
        server crs-app3:8080;

        # 连接保持(减少 TCP 握手开销)
        keepalive 32;
    }

    # HTTP -> HTTPS 重定向
    server {
        listen 80;
        server_name _;

        # 健康检查端点保持 HTTP (供 Docker healthcheck 使用)
        location /health {
            access_log off;
            return 200 '{"status":"UP","service":"nginx-lb"}';
            add_header Content-Type application/json;
        }

        # 其他所有请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 主服务
    server {
        listen 443 ssl;
        server_name _;

        # SSL 证书配置
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL 协议与加密套件 (TLS 1.2 + 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # SSL 会话缓存
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # 客户端请求限制
        client_max_body_size 10m;
        client_body_timeout 30s;
        client_header_timeout 30s;

        # Nginx 健康检查端点
        location /health {
            access_log off;
            return 200 '{"status":"UP","service":"nginx-lb","scheme":"https"}';
            add_header Content-Type application/json;
        }

        # API 代理到 Spring Boot 集群
        location /api/ {
            proxy_pass http://crs_backend;
            proxy_http_version 1.1;

            # 代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # 默认返回 404
        location / {
            return 404 '{"error":"Not Found","message":"Use /api/ prefix for API endpoints"}';
            add_header Content-Type application/json;
        }
    }
}
